name: 🚀 Build & Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Release (Windows x64)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install Frontend Dependencies
        run: pnpm install --frozen-lockfile

      - name: Download & Setup MPV Engine
        shell: powershell
        run: pnpm setup-mpv

      - name: Build Tauri NSIS Application Bundle
        run: pnpm tauri build --bundles nsis

      - name: Package Portable Green Edition
        shell: powershell
        run: |
          $Version = "${{ github.ref_name }}".TrimStart('v')
          if ([string]::IsNullOrEmpty($Version)) { $Version = "1.0.0" }
          $PortableDir = "NovidPlayer-v$Version-windows-x64-portable"
          New-Item -ItemType Directory -Path $PortableDir -Force

          # Copy main executable
          Copy-Item "src-tauri\target\release\NovidPlayer.exe" -Destination "$PortableDir\"

          # Copy MPV binaries
          New-Item -ItemType Directory -Path "$PortableDir\binaries" -Force
          Copy-Item "src-tauri\binaries\*" -Destination "$PortableDir\binaries\" -Recurse

          # Create portable flag file
          New-Item -ItemType File -Path "$PortableDir\portable.dat" -Force

          # Create README in portable archive
          Set-Content -Path "$PortableDir\PORTABLE_README.txt" -Value @"
          ==================================================
          NovidPlayer - Portable Edition
          ==================================================
          This is a self-contained portable distribution.
          All temporary files and local caches will be saved
          under the local 'data' directory instead of system AppData.

          Enjoy smooth, modern video playback!
          https://github.com/Thief-K/novid-player
          "@

          # Zip the portable directory
          Compress-Archive -Path $PortableDir -DestinationPath "$PortableDir.zip" -Force

      - name: Collect Release Artifacts & Generate Checksums
        shell: powershell
        run: |
          New-Item -ItemType Directory -Path "release_assets" -Force

          # Copy NSIS installer
          Get-ChildItem -Path "src-tauri\target\release\bundle\nsis\*.exe" | Copy-Item -Destination "release_assets\"

          # Copy portable zip
          Get-ChildItem -Path "*-portable.zip" | Copy-Item -Destination "release_assets\"

          # Compute SHA-256 Checksums
          Get-ChildItem -Path "release_assets\*" | ForEach-Object {
            $Hash = (Get-FileHash -Path $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$Hash  $($_.Name)" | Out-File -FilePath "release_assets\checksums.txt" -Append -Encoding ascii
          }

          Get-Content "release_assets\checksums.txt"

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: release_assets/*
          generate_release_notes: true
          draft: false
          prerelease: false
