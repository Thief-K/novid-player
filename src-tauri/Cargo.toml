[package]
name = "novidplayer"
version = "1.0.0"
description = "Modern Minimalist MPV Video Player for Windows 11"
authors = ["NovidPlayer Team"]
edition = "2021"

[lib]
name = "novidplayer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
base64 = "0.22"
tokio = { version = "1.38", features = ["full", "sync", "io-util", "net", "process", "time"] }
parking_lot = "0.12"
log = "0.4"
env_logger = "0.11"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "z"
strip = true
